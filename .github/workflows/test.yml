name: Comment collector browser tests
on:
  push:
    branches: [main]
    paths: ['extension/**', 'v2/**', 'tests/**', 'package.json', 'package-lock.json', '.github/workflows/test.yml']
  pull_request:
    paths: ['extension/**', 'v2/**', 'tests/**', 'package.json', 'package-lock.json', '.github/workflows/test.yml']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.mjs
      - run: npm install --prefix /tmp/collector-browser playwright@1.62.1 linkedom@0.18.12 --no-audit --no-fund
      - run: node extension/test-offline-dom.cjs
        env:
          LINKEDOM_MODULE: /tmp/collector-browser/node_modules/linkedom
      - run: node v2/test-offline-dom.cjs
        env:
          LINKEDOM_MODULE: /tmp/collector-browser/node_modules/linkedom
      - run: node v2/test-ui-dom.cjs
        env:
          LINKEDOM_MODULE: /tmp/collector-browser/node_modules/linkedom
      - run: /tmp/collector-browser/node_modules/.bin/playwright install --with-deps chromium
      - run: node extension/test-dom.cjs
        env:
          PLAYWRIGHT_MODULE: /tmp/collector-browser/node_modules/playwright
      - run: node v2/test-browser.cjs
        env:
          PLAYWRIGHT_MODULE: /tmp/collector-browser/node_modules/playwright

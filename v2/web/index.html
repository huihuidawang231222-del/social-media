<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="local-token" content="__LOCAL_TOKEN__"><title>评论收集站</title><link rel="stylesheet" href="/style.css"></head>
<body>
<header><div class="brand"><span class="pixel-logo" aria-hidden="true"></span><h1>评论收集站</h1><span class="version">V2</span></div><span id="connection" class="connection" role="status">连接中…</span></header>
<main>
<section class="setup" aria-labelledby="new-task-title">
<div class="sectionhead"><h2 id="new-task-title">新建采集</h2><span class="pixel-dot" aria-hidden="true"></span></div>
<form id="task-form">
<div class="twocol top-fields"><label>平台<select id="platform" name="platform"><option value="xiaohongshu" selected>小红书</option><option value="bilibili">B站</option><option value="douyin">抖音 · 测试中</option></select></label><label>运行模式<select name="mode"><option value="live">真实采集</option><option value="demo">合成演示</option></select></label></div>
<label>搜索关键词<textarea name="keywords" rows="4" placeholder="广州 双休&#10;每行一个关键词" required maxlength="1000"></textarea></label>
<div class="twocol"><label>最多帖子数<input name="maxPosts" type="number" value="10" min="1" max="50" required></label><label>每帖最多评论<input name="perPost" type="number" value="100" min="1" max="500" required></label></div>
<details class="settings"><summary>更多设置</summary><label>评论筛选<input name="filter" placeholder="加班,工资（可不填）" maxlength="500"></label><label>操作间隔<select name="intervalMs"><option value="4000">4 秒</option><option value="8000">8 秒</option><option value="15000">15 秒</option></select></label><details class="selectors"><summary>页面适配</summary><p>留空使用默认规则。</p><label>评论容器<input name="item" placeholder=".comment-item"></label><label>正文<input name="text" placeholder=".content"></label><label>作者<input name="author"></label><label>时间<input name="time"></label><label>点赞<input name="likes"></label></details></details>
<label class="check"><input type="checkbox" name="authorized" required><span>仅采集我有权使用的内容</span></label>
<button class="primary" type="submit"><span aria-hidden="true">▶</span> 开始采集</button><button id="login" class="login-button" type="button">登录平台 ↗</button>
</form>
<details class="help"><summary>使用说明</summary><p>首次使用先登录。遇到验证，处理后点继续。</p><p>仅采集已加载评论。合成演示不访问平台，数据保存在本机。</p></details>
</section>
<section class="workspace" aria-labelledby="tasks-title"><div class="sectionhead"><h2 id="tasks-title">采集记录</h2><span class="record-mark" aria-hidden="true">▦</span></div><div id="notice" role="status" aria-live="polite"></div><div id="tasks" class="tasks"><div class="empty"><span class="empty-icon" aria-hidden="true"></span><strong>还没有采集记录</strong></div></div><section id="detail" hidden><div class="sectionhead"><h2>任务详情</h2><button id="close-detail" type="button">收起</button></div><div id="detail-content"></div></section></section>
</main><script type="module" src="/app.js"></script></body></html>
